, "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 1037, "impression_count": 172048, "like_count": 1133, "quote_count": 2, "reply_count": 19, "repost_count": 40}}, {"id": "2087630728552919514", "text": "2026 Fantasy Football \n\nTeam Roles Update https://t.co/ygfh2laJM6", "created_at": "2026-08-12T20:02:06.000Z", "username": "P2WFantasy", "name": "Skrip", "url": "https://x.com/P2WFantasy/status/2087630728552919514", "urls": ["https://x.com/P2WFantasy/status/2087630728552919514/photo/1"], "folders": [], "summary": "Image update of team roles for 2026 fantasy football.", "tags": ["fantasy football"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 601, "impression_count": 86713, "like_count": 650, "quote_count": 1, "reply_count": 17, "repost_count": 36}}, {"id": "2087571258888302841", "text": "🚨BREAKING: PEOPLE KNOW WHEN YOU'RE USING CHATGPT AND CLAUDE.\n\n​The structure, the tone, the excessive polish. It all gives you away.\n\n​7 prompts that fix this:", "created_at": "2026-08-12T16:05:47.000Z", "username": "Ambrose0_X", "name": "AnderSon", "url": "https://x.com/Ambrose0_X/status/2087571258888302841", "urls": [], "folders": ["Claude"], "summary": "Says 7 prompts make ChatGPT and Claude output sound less obviously AI-written.", "tags": ["Grok Bot/prompting", "Claude/LLMs"], "actionable": true, "action_note": "Use to make Grok Bot drafts and job-search messages sound less obviously AI-written.", "score": 3, "metrics": {"bookmark_count": 13004, "impression_count": 1776664, "like_count": 3217, "quote_count": 25, "reply_count": 109, "repost_count": 363}}, {"id": "2087559769230094452", "text": "A guy bought a $250 Sonos speaker and used it every single day for 2 years.\n\nMusic while cooking. Podcasts on his commute. Movie audio on weekends. Alexa reading him the news every morning at 7am.\n\nThousands of hours of listening. Same speaker. Same room. Same setup he plugged in on day one and never touched again.\n\nHe thought it sounded \"good enough.\" He assumed that's just what a $250 speaker sounds like — decent, not amazing, nothing to think about.\n\nHis friend, an audio engineer who's mixed records for a living for over a decade, came over for dinner one night. Music was playing low in the background while they cooked.\n\nShe stopped mid-sentence, looked at the speaker like it had personally offended her, and said:\n\n\"Your speaker's been lying to you for 2 years.\"", "created_at": "2026-08-12T15:20:08.000Z", "username": "primemans", "name": "Prime AI", "url": "https://x.com/primemans/status/2087559769230094452", "urls": [], "folders": [], "summary": "Story hook about a Sonos speaker that sounded worse than it should for 2 years until an audio engineer pointed out a setup problem.", "tags": ["other"], "actionable": false, "action_note": "", "score": 0, "metrics": {"bookmark_count": 2836, "impression_count": 1338072, "like_count": 587, "quote_count": 4, "reply_count": 54, "repost_count": 52}}, {"id": "2087502355982066125", "text": "Sam Altman:\n\n\"We're going to see 10-person billion-dollar companies pretty soon.\"\n\n\"If I were 22 right now, I'd feel like the luckiest kid in history.\"\n\nMost people will read this, feel inspired for 3 minutes, and go back to what they were doing.\n\nThe ones who act will build a money making machine this weekend.\n\nOne tool. 60 minutes. $10K/month.\n\nThis is the how ↓", "created_at": "2026-08-12T11:32:00.000Z", "username": "sairahul1", "name": "Rahul", "url": "https://x.com/sairahul1/status/2087502355982066125", "urls": ["https://x.com/sairahul1/status/2087502355982066125/video/1", "https://twitter.com/sairahul1/status/2087483738322346424"], "folders": ["AI"], "summary": "Uses a Sam Altman quote about 10-person billion-dollar companies to promote a '1 tool, 60 minutes, $10K/month' guide.", "tags": ["business/startups", "AI agents"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 3778, "impression_count": 1244186, "like_count": 1984, "quote_count": 10, "reply_count": 57, "repost_count": 229}}, {"id": "2087298039283396820", "text": "If you pay your taxes in full you're a moron.\n\nThe worst thing the IRS can do to you costs less than Netflix.\n\n$80 a month on a payment plan while the debt runs out its 10 year expiration date. Then the balance dies. Legally:\n\nthe IRS has a hard 10 year clock to collect a tax debt. Day one is the day they assess it. Day 3,653 it's dead. The lien drops off, the file closes, and they legally cannot touch you for another cent.\n\nso why the fuck would you hand them $100k today\n\nyou pay the minimum. $80, $150, whatever keeps the levies off. and you keep the other $100k.\n\ndrop it in your business. drop it in an index fund. drop it in anything that makes more than nothing. for ten years.\n\nthe clock runs the whole time. payments don't reset it. only bankruptcy or an offer in compromise pauses it, so you don't file either.\n\nguy owed $187k assessed in 2015. paid $400 a month. clock hit zero in 2025. he paid $43k total and the IRS ate the other $144k because time ran out.\n\nhe kept a house's worth of money for a decade and the government just... gave up.\n\nthe scariest creditor in america built a self-destruct timer into every debt and prays you panic and pay before it goes off lmfaooo\n\n(we fix credit and stack capital. owe back taxes? handle that first. link in bio)", "created_at": "2026-08-11T22:00:07.000Z", "username": "hxxntrr", "name": "hunter", "url": "https://x.com/hxxntrr/status/2087298039283396820", "urls": [], "folders": ["IRS"], "summary": "Engagement-bait post arguing you should never pay IRS debt in full: pay a small installment while the 10-year collection statute (CSED) runs out, and invest the difference. It glosses over real risks (penalties and interest keep accruing, liens, CSED suspensions while installment requests are pending, and IRS terms on large balances) and ends in a credit-repair sales pitch.", "tags": ["finance/tax"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 2684, "impression_count": 789659, "like_count": 1513, "quote_count": 16, "reply_count": 174, "repost_count": 124}}, {"id": "2086788576977813842", "text": "Palmer Luckey says there's no country he won't sell weapons to\n\n\"There is no country that I will not sell to. It needs to be under the direction of the United States government. It's not my place to decide who to sell to and who to not.\"\n\n\"If I were to take that position, it's me effectively saying I don't believe in democracy. It's no different than saying that US military policy should be controlled by corporate executives.\"\n\n\"Imagine a world where a handful of defense executives could unilaterally say, the government and the people have voted to support this country, but we refuse. We'll ensure that they're destroyed by their adversary. That far more than AI, that's a power I do not want to have.\"\n\n\"I would love to live in a world where I can sell weapons to China or a reformed North Korea. The world changes and you need to be not just ready for that change, but hope for that change. I hope that that world comes to pass.\"", "created_at": "2026-08-10T12:15:42.000Z", "username": "dnapway", "name": "dnap", "url": "https://x.com/dnapway/status/2086788576977813842", "urls": ["https://x.com/dnapway/status/2086788576977813842/video/1"], "folders": [], "summary": "Palmer Luckey says Anduril will sell weapons to any country the US government approves, arguing executives shouldn't override democratic decisions.", "tags": ["space/tech"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 1911, "impression_count": 185587, "like_count": 4953, "quote_count": 25, "reply_count": 191, "repost_count": 112}}, {"id": "2086464982871363988", "text": "@MTC3410 @SleeperNFL Ted Hurst III, the Bucs' 3rd-round WR from Georgia State (jersey #17). Big, physical outside receiver they drafted as a Mike Evans-style replacement after Evans left for the 49ers.", "created_at": "2026-08-09T14:49:51.000Z", "username": "grok", "name": "Grok", "url": "https://x.com/grok/status/2086464982871363988", "urls": [], "folders": ["Fantasy"], "summary": "Grok reply in a Sleeper thread describing Ted Hurst III as the Bucs' 3rd-round WR out of Georgia State, a big outside receiver drafted as a possible Mike Evans-style replacement.", "tags": ["fantasy football", "Grok Bot/prompting"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 13, "impression_count": 7604, "like_count": 3, "quote_count": 0, "reply_count": 0, "repost_count": 0}}, {"id": "2085935534636196346", "text": "🚨 URGENT: Claude can now CREATE a YouTube channel from scratch and take it to monetization in just 90 days. 100% free.\n\nHere are 8 prompts to achieve it:", "created_at": "2026-08-08T03:46:00.000Z", "username": "Tech_Arish", "name": "Arish Ai", "url": "https://x.com/Tech_Arish/status/2085935534636196346", "urls": [], "folders": ["Claude"], "summary": "Hype thread promising 8 Claude prompts that will build a YouTube channel and get it monetized in 90 days. Low-substance engagement bait.", "tags": ["Claude/LLMs"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 9811, "impression_count": 1069712, "like_count": 4582, "quote_count": 6, "reply_count": 87, "repost_count": 480}}, {"id": "2085789790759485817", "text": "NVIDIA CEO, Jensen Huang:\n\n\"Nobody writes prompts anymore. The new job is building Loops and Graphs.\"\n\nIn 50 minutes he explains why the engineers who stopped prompting are already years ahead, and what they're building instead.\n\nThe missing piece most people skip: loops handle the work, graphs handle the loops.\n\nWatch it, then read the full guide on loops and graphs below.", "created_at": "2026-08-07T18:06:52.000Z", "username": "Mahaximus_", "name": "Mahax", "url": "https://x.com/Mahaximus_/status/208578979075
