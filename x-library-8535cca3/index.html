count": 12}}, {"id": "2077411733333741698", "text": "Babe, wake up: Fantasy football running back tiers just dropped!\n\n-This year we'll spell redemption S-a-q-u-o-n\n-How do fantasy RBs perform in bad real-life offenses?\n-Are we drinking the Bhayshul Tuten Kool-Aid? (yes)\n-Tank Bigsby no matter what\n-MORE\n\n✍️ https://t.co/A0WeTFgQ8M https://t.co/GWLxDsMlWx", "created_at": "2026-07-15T15:15:28.000Z", "username": "Ihartitz", "name": "Ian Hartitz", "url": "https://x.com/Ihartitz/status/2077411733333741698", "urls": ["https://www.rotowire.com/football/article/fantasy-football-draft-rankings-2026-rb-tiers-122683", "https://x.com/Ihartitz/status/2077411733333741698/photo/1"], "folders": [], "summary": "Links to RotoWire's 2026 RB tiers article, with takes on Saquon Barkley's rebound, RBs on bad offenses, Bhayshul Tuten and Tank Bigsby.", "tags": ["fantasy football"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 450, "impression_count": 152933, "like_count": 720, "quote_count": 1, "reply_count": 28, "repost_count": 26}}, {"id": "2077377105289941277", "text": "Fantasy football championship teams often feature THE difference maker at RB.\n\nLast year, 20.1% of league winners rostered the overall RB1.\n\nHere are 5 RBs that you NEED to draft after round 1 with RB1 overall upside👇\n\n1. Ashton Jeanty https://t.co/qGF2VBznK1", "created_at": "2026-07-15T12:57:52.000Z", "username": "EthanKreagerFF", "name": "Ethan Kreager", "url": "https://x.com/EthanKreagerFF/status/2077377105289941277", "urls": ["https://x.com/EthanKreagerFF/status/2077377105289941277/photo/1"], "folders": [], "summary": "Says 20.1% of league winners last year had the overall RB1, then lists 5 RBs available after round 1 that could finish as RB1, starting with Ashton Jeanty.", "tags": ["fantasy football"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 76, "impression_count": 65617, "like_count": 118, "quote_count": 3, "reply_count": 19, "repost_count": 8}}, {"id": "2076290926956122518", "text": "If you are playing fantasy football in 2026...\n\nHere's how the first 5 rounds of your PPR draft should go:\n\n1. Bijan Robinson\n2. Jahmyr Gibbs\n3. Ja'Marr Chase\n4. Puka Nacua\n5. Christian McCaffrey\n6. Jaxon Smith-Njigba\n7. Justin Jefferson\n8. Ashton Jeanty https://t.co/S8dyXxKN4X", "created_at": "2026-07-12T13:01:47.000Z", "username": "EthanKreagerFF", "name": "Ethan Kreager", "url": "https://x.com/EthanKreagerFF/status/2076290926956122518", "urls": ["https://x.com/EthanKreagerFF/status/2076290926956122518/photo/1"], "folders": [], "summary": "A suggested order for the first 5 rounds of a 2026 PPR draft, led by Bijan Robinson, Jahmyr Gibbs, Ja'Marr Chase and Puka Nacua.", "tags": ["fantasy football"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 102, "impression_count": 50803, "like_count": 147, "quote_count": 1, "reply_count": 28, "repost_count": 17}}, {"id": "2075193776222450108", "text": "If you got laid off tomorrow &amp; had to replace your income ASAP, here's exactly what to do:\n\n1. Go to Amazon and open a fresh account. Use a different name. It can be completely anonymous.", "created_at": "2026-07-09T12:22:06.000Z", "username": "NickDiFabio1", "name": "Nick Di Fabio", "url": "https://x.com/NickDiFabio1/status/2075193776222450108", "urls": [], "folders": [], "summary": "A clickbait thread on replacing your income fast after a layoff. It starts by telling you to open an anonymous Amazon account, which suggests a side-hustle pitch.", "tags": ["career", "business/startups"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 10414, "impression_count": 2396729, "like_count": 2890, "quote_count": 12, "reply_count": 101, "repost_count": 266}}, {"id": "2072666661912527226", "text": "Here are 7 players who could explode in fantasy football this year...\n\n#1 Brock Bowers... https://t.co/987yXJrwhs", "created_at": "2026-07-02T13:00:15.000Z", "username": "SalVetriDFS", "name": "SAL VETRI", "url": "https://x.com/SalVetriDFS/status/2072666661912527226", "urls": ["https://x.com/SalVetriDFS/status/2072666661912527226/photo/1"], "folders": [], "summary": "SalVetriDFS lists 7 players he thinks could break out in fantasy football this season. Brock Bowers is #1, and the rest of the list is in an attached image.", "tags": ["fantasy football", "sports/betting"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 102, "impression_count": 96696, "like_count": 150, "quote_count": 1, "reply_count": 11, "repost_count": 7}}, {"id": "2072440120817627225", "text": "You owe the IRS $100,000\n\nThey'll take $5,000 and close your file. Permanently. Balance goes to $0\n\nIt's called an Offer in Compromise. Form 656. The IRS approved 42% of them last year. Application fee: $205\n\nHere's the exact formula they use to decide your number and how to reverse-engineer the lowest possible offer\n\nThe IRS doesn't want to chase you for 10 years. Collection employs 78,000 people. Each agent costs the agency $89,000/year in salary and overhead. Liens require court filings. Levies require processing. Garnishments require administration. They'd rather take your $5,000 check today than spend $120,000 in administrative costs over a decade trying to squeeze $100,000 out of someone who will never have it\n\nThey literally built a math formula to calculate the minimum they'll accept. Here it is:\n\nRCP = (monthly disposable income x remaining collection months) + (net realizable equity in assets)\n\nMonthly disposable income: your gross monthly income minus IRS-allowed living expenses. They don't use YOUR actual expenses. They use standardized tables published at the irs website standards. These tables set exact allowances by county for housing, food, transportation, healthcare, and out-of-pocket expenses\n\nIf you earn $4,200/month and the IRS allowable expense table for your county totals $3,900, your disposable income is $300/month. If you earn $3,800/month and the table allows $3,900, your disposable income is negative and the IRS considers it $0\n\nRemaining collection months: for a lump sum offer (paid in 5 months or less), multiply disposable income by 12. For a periodic payment offer (paid over 6-24 months), multiply by 24. The lump sum multiplier is lower, which means a lump sum offer will always be cheaper than a payment plan offer. Always choose lump sum if you can\n\nNet realizable equity in assets: bank accounts, investments, vehicles, real property. BUT they subtract allowances. Your primary car: exempt up to the IRS local standard (roughly $6,000-$10,000 in equity depending on area). Household furnishings: fully exempt. Retirement accounts: partially exempt and heavily discounted (the IRS applies a \"quick sale value\" of 60-80% of actual value because they know selling retirement accounts triggers penalties)\n\nReal calculation:\n\nIncome: $4,200/month\nIRS allowed expenses: $3,900/month\nDisposable income: $300/month\n\nLump sum multiplier: 12 months\n$300 x 12 = $3,600\n\nAssets:\nBank account: $2,100\nCar equity: $4,800 (below IRS exemption, counts as $0)\n401k: $18,000 (quick sale value at 60% = $10,800, minus 10% early withdrawal penalty = $9,720, minus taxes at 22% = $7,582)\nHousehold goods: exempt\n\nBut here's the part most people don't know: you can CHOOSE to exclude retirement accounts from the RCP calculation by checking a specific box on Form 433-A (OIC). The IRS has an internal policy (IRM 5.8.5.24) that allows exclusion of retirement assets for taxpayers under age 65 if liquidating those assets would cause economic hardship. Your tax preparer should know this. Most don't\n\nRevised RCP without retirement: $3,600 + $2,100 = $5,700\n\nYour offer: $5,700 on $100,000 in tax debt. 5.7 cents on the dollar\n\nThe nuclear part:\n\nWhile the OIC is being reviewed (6-24 months), ALL collection activity legally stops. No levies. No new liens. No wage garnishment. The IRS cannot collect a single dollar from you while your offer is pending. This is codified in IRC Section 6331(k)(1)\n\nAnd if the IRS fails to make a determination within 24 months of receiving your application, your offer is AUTOMATICALLY ACCEPTED. Two years of silence = you win by default. IRC Section 7122(f). They built an auto-accept clause into the law that most taxpayers never invoke because most taxpayers never file an OIC\n\nThe forms you need:\n\nForm 433-A (OIC): complete financial disclosure for individuals. Every bank account, every asset, every income source, every expense. 8 pages. Fill it out accurately because they cross-reference against IRS records, DMV records, and financial institution reports. Lying on this form is a federal crime under 18 U.S.C. 1001\n\nForm 656: the actual offer. Your amount, your payment terms, your signature\n\n$205 application fee (waived if income is below 250% of federal poverty level, which is $38,100 for a single person in 2026)\n\nInitial payment with the application: 20% of your offer for lump sum. On a $5,700 offer that's $1,140\n\nA woman owed $213,000 across 4 tax years (2019-2022). Hadn't filed 2020 or 2021. Hadn't paid any of them. Receiving CP504 notices (intent to levy) every month. We filed the delinquent returns first (required before OIC submission), then calculated her RCP at $8,400. Submitted OIC with $1,680 initial payment\n\nIRS accepted 9 months later. $213,000 settled for $8,400. 3.9 cents on the dollar\n\nShe went from getting levy notices every month to a $0 IRS balance. Then we fixed her credit (the tax lien had destroyed it). Then we stacked $120K in 0% business funding. She opened a cleaning company 4 months later. The same IRS that was garnishing her wages is now processing her quarterly estimated tax payments from a profitable business\n\nthe IRS is the scariest creditor in America. they can garnish without a court order. seize your bank account with 30 days notice. lien every asset you own. but they also built a form where they calculate the minimum they'll accept using a formula you can reverse-engineer, and if they don't respond in 2 years your offer is automatically approved. the math is public. the formula is published. the form costs $205. the difference between paying $100K and paying $5K is knowing it exists lol\n\n(we fix credit and build capital stacks. if you owe back taxes, handle that first. then we get you funded. link in bio)", "created_at": "2026-07-01T22:00:03.000Z", "username": "hxxntrr", "name": "hunter", "url": "https://x.com/hxxntrr/status/2072440120817627225", "urls": [], "folders": ["IRS"], "summary": "Explains how the IRS Offer in Compromise (Form 656) works and the formula it uses to set the minimum it will accept: disposable income times 12 or 24 months, plus net equity in assets after allowances. Includes a worked example.", "tags": ["finance/tax"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 10303, "impression_count": 975266, "like_count": 4539, "quote_count": 22, "reply_count": 99, "repost_count": 561}}, {"id": "2071531267745554517", "text": "Millionaire investor Pace Morby says RV parks are one of the best investments because they're \"lazy assets\" that can generate $30,000 to $40,000 a month with almost no management\n\n\"People tell you to buy laundromats. No, you should buy an RV park and put a laundromat in the RV park. The RV park is the main staple. There's almost no management, the manager lives on-site, and there's basically nothing to fix because it's mostly gravel\"\n\n\"I've got a 580-unit multifamily property in North Houston, and we're constantly fixing things and dealing with tenants moving in and out. RV parks are different. You can buy a good one for $3 million to $7 million on seller financing, and they can net $30,000 to $40,000 a month after every expense. I call them the only true 'one-and-done' asset.\"", "created_at": "2026-06-29T09:48:36.000Z", "username": "CryptoMikli", "name": "Mikli", "url": "https://x.com/CryptoMikli/status/2071531267745554517", "urls": ["https://x.com/CryptoMikli/status/2071531267745554517/video/1"], "folders": [], "summary": "Pace Morby claims RV parks are low-management 'lazy assets' that can net $30-40K a month and can be bought for $3-7M with seller financing.", "tags": ["business/startups", "finance/tax"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 9468, "impression_count": 2839192, "like_count": 14060, "quote_count": 60, "reply_count": 299, "repost_count": 868}}, {"id": "2069736449902027136", "text": "A senior Anthropic engineer just dropped 11-page PDF on \"Loop Engineering\" for agentic systems.\n\nThe shift: you stop prompting the agent. You build the system that prompts it instead.\n\nSchedule → Discover → Build → Verify → Repeat\n\nEvery loop runs one turn, five moves:\n\n• Discovery: it finds its own work - failing CI, open issues, recent commits - instead of being handed a list.\n\n• Handoff: each task gets an isolated git worktree so parallel agents don't collide.\n\n• Verification: a second agent, told to assume the code is broken, reviews the first. The \"thing that can say no.\"\n\n• Persistence: results get written to disk, never left in a context window that gets flushed.\n\n• Scheduling: an automation wakes it on a timer. That's what makes it a loop.\n\nThe key insight: an agent grading its own work always praises it. \n\nThis 11-page PDF changed how I'm building agentic systems today.\n\nRead it now, then explore the article below.", "created_at": "2026-06-24T10:56:38.000Z", "username": "0xCodez", "name": "Codez", "url": "https://x.com/0xCodez/status/2069736449902027136", "urls": ["https://x.com/0xCodez/status/2069736449902027136/photo/1", "https://twitter.com/0xCodez/status/2064374643729773029"], "folders": ["Claude"], "summary": "A summary of an 'Loop Engineering' PDF for agentic systems: a scheduled Discover → Build → Verify loop, with isolated git worktrees per task, a separate skeptical verifier agent, and results saved to disk.", "tags": ["AI agents", "Claude/LLMs", "dev tools"], "actionable": true, "action_note": "A good blueprint for Grok Bot chief-of-staff loops: a scheduled trigger, a separate verifier agent so the bot doesn't grade its own work, and state saved to disk instead of left in context.", "score": 5, "metrics": {"bookmark_count": 10528, "impression_count": 1272477, "like_count": 4863, "quote_count": 39, "reply_count": 123, "repost_count": 763}}, {"id": "2069129013742743959", "text": "Here’s how I see $SPCX playing out from here:\n\n$150 -> $225 -> $160\n\n$160 -> $134 -> $117\n\n$117 -> $85 -> $92\n\n$92 -> $148 -> $270\n\nKeep in mind: I’ve called every major market top and bottom for over 10 YEARS.\n\nI was one of the only people who called the top in October, and I’ll do it again, that’s literally my job.\n\nIf you still haven’t followed me, you’ll regret it.", "created_at": "2026-06-22T18:42:54.000Z", "username": "Danny_Crypton", "name": "DANNY", "url": "https://x.com/Danny_Crypton/status/2069129013742743959", "urls": ["https://x.com/Danny_Crypton/status/2069129013742743959/video/1", "https://twitter.com/Kalshi_Finance/status/2069112353942053099"], "folders": ["SpaceX"], "summary": "A self-promoting trader posts a multi-leg price path for $SPCX ($150 → $225 → ... → $270) and claims he has called every market top and bottom for 10 years.", "tags": ["trading/markets"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 927, "impression_count": 826292, "like_count": 1153, "quote_count": 10, "reply_count": 85, "repost_count": 115}}, {"id": "2069040839397982268", "text": "This year’s Fantasy Football draft board is the easiest to read in HISTORY…\n\nThis strategy will build a league-winning team every time:\n\nRound 1…", "created_at": "2026-06-22T12:52:31.000Z", "username": "JoeOrrico", "name": "Joe Orrico", "url": "https://x.com/JoeOrrico/status/2069040839397982268", "urls": [], "folders": [], "summary": "The opening of a fantasy football thread promising a round-by-round draft strategy for this year's board; only the hook was captured.", "tags": ["fantasy football"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 341, "impression_count": 83721, "like_count": 198, "quote_count": 1, "reply_count": 15, "repost_count": 14}}, {"id": "2066401066518802637", "text": "https://t.co/tlLZjVprSj", "created_at": "2026-06-15T06:03:00.000Z", "username": "mikenevermiss", "name": "MIKE", "url": "https://x.com/mikenevermiss/status/2066401066518802637", "urls": ["http://x.com/i/article/2066041362298912768"], "folders": ["Claude"], "summary": "Link to an X article with no visible text, so the content can't be determined from the bookmark.", "tags": ["other"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 6004, "impression_count": 1949796, "like_count": 1601, "quote_count": 28, "reply_count": 73, "repost_count": 189}}, {"id": "2065899500682551702", "text": "WE ARE SOOOOO BACK!\n\nSomeone leaked the Claude Fable 5 system prompt and ran it on an Opus 4.8\n\nOutput is like 90% of the real thing\n\nTurns out half the magic was never the weights. It was the prompt the whole time\n\nRepo down below: https://t.co/IjLKYRJK6A", "created_at": "2026-06-13T20:49:58.000Z", "username": "ziwenxu_", "name": "Ziwen", "url": "https://x.com/ziwenxu_/status/2065899500682551702", "urls": ["https://twitter.com/theonejvo/status/2065816283476824126"], "folders": ["Claude"], "summary": "Claims a leaked Claude Fable 5 system prompt run on Opus 4.8 gives about 90% of Fable's output quality. This is unverified and the claim is likely overstated.", "tags": ["Claude/LLMs", "Grok Bot/prompting"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 4721, "impression_count": 811473, "like_count": 3381, "quote_count": 20, "reply_count": 94, "repost_count": 259}}, {"id": "2065852463052386644", "text": "A guy was ready to drop $1,500 on a new OLED TV because his 3-year-old Smart TV was freezing up and took 5 seconds just to respond to the remote.\n\nHe unplugged it. Deleted old apps. Cleared the cache. The lag kept coming back.\n\nHe went to Best Buy to get a replacement.\n\nThe home theater installer in the blue shirt stopped him: \"Before you spend a grand, let me show you something.\"\n\nHe grabbed a remote and shook his head.\n\n\"There are 8 hidden tracking settings throttling your TV's processor right now. Manufacturers turn them all on by default. Nobody tells you they exist. Let's fix this.\"\n\nHere's what he showed him in the next 8 minutes. 🧵", "created_at": "2026-06-13T17:43:03.000Z", "username": "AIPandaX", "name": "AI Panda", "url": "https://x.com/AIPandaX/status/2065852463052386644", "urls": [], "folders": [], "summary": "An engagement-bait thread claiming 8 hidden tracking settings slow down smart TVs and that turning them off fixes lag.", "tags": ["other"], "actionable": false, "action_note": "", "score": 0, "metrics": {"bookmark_count": 46193, "impression_count": 2946534, "like_count": 13304, "quote_count": 72, "reply_count": 198, "repost_count": 2107}}, {"id": "2065066247448821841", "text": "This is the best way to use Claude Fable in Claude Code without immediately hitting your limits.\n\n1. Model set to Fable 5\n2. Reasoning on Max\n3. Instruct Claude to run a dynamic workflow where:\n3a. Fable is the orchestrator\n3b. Opus does the reasoning heavy phases\n\nFable is so overpowered that you don't need its intelligence for every step. \n\nLet it orchestrate Opus or even Sonnet.", "created_at": "2026-06-11T13:38:55.000Z", "username": "daniel_mac8", "name": "Dan McAteer", "url": "https://x.com/daniel_mac8/status/2065066247448821841", "urls": ["https://x.com/daniel_mac8/status/2065066247448821841/video/1"], "folders": ["Claude"], "summary": "A tip for stretching Claude Code limits: use Fable 5 as the orchestrator in a dynamic workflow and hand the reasoning-heavy phases to Opus or Sonnet.", "tags": ["Claude/LLMs", "dev tools", "AI agents"], "actionable": true, "action_note": "Cost and limit management for building Card Room, Athletes Only, and the sportsbook redesign in Claude Code: run Fable as the orchestrator and cheaper models as workers.", "score": 4, "metrics": {"bookmark_count": 9599, "impression_count": 912355, "like_count": 5606, "quote_count": 61, "reply_count": 193, "repost_count": 341}}, {"id": "2064882870037225762", "text": "Anthropic posted a FULL GUIDE on how to prompt Fable 5 (Mythos).\n\nClaude Fable 5 is not meant to be prompted like any other model.\n\nIt's meant to run autonomously.\n\nHere's exactly how to enable Fable to do work for you with minimal manual intervention:\n\n1. Effort selection\n\nAnthropic recommends using High for most tasks and Xhigh only for complex workflows.\n\nLow/medium: quick questions, basic research\nHigh: default for most work\nXhigh: complex builds, multi-step analysis\nUltracode: full autonomous orchestration\n\n2. /loop prompting\n\nUse /loop prompts to kick Fable off to complete full tasks.\n\n/loop <time interval> + <goal>\n\n3. Tell it WHY, not just what (context)\n\nFable can't perform on instructions alone. It needs context to make decisions on its own.\n\nAnthropic's exact prompting structure:\n\n\"I'm working on [larger task] for [who it's for]. They need [what the output enables]. With that in mind: [your actual request].\"\n\n4. Keep prompts short (instructions)\n\nCounterintuitive but critical.\n\nOver-engineering your prompts on Fable 5 degrades output. You're constraining a model that would have figured it out on its own.\n\n4. Tell it when to stop and check in during runs\n\n\"Pause for me only when the work genuinely requires my input: a destructive action, a real scope change, or something only I can provide. Otherwise, keep going and report back when done.\"\n\n5. Build it a memory system\n\nFable performs best when it can record lessons from its previous loops.\n\nGive it a markdown file and this instruction:\n\n\"Store one lesson per file with a one-line summary at the top. Record corrections and confirmed approaches. Don't save what the repo or chat history already records.\"\n\nThe optimal general prompt structure:\n\n\"Goal: I'm working on [larger task] for [who it's for]. They need [what the output enables].\n\nRequest: [your specific ask in one sentence]\n\nOutput format: [exactly how you want it]\n\nConstraints: [what must not happen].\"\n\nOne last thing - your old prompts may actually work against you.\n\nSkills and project instructions built for Opus 4.8 may produce worse results on Fable.\n\nBookmark this to actually maximize your Fable workflows.", "created_at": "2026-06-11T01:30:14.000Z", "username": "milesdeutscher", "name": "Miles Deutscher", "url": "https://x.com/milesdeutscher/status/2064882870037225762", "urls": ["https://x.com/milesdeutscher/status/2064882870037225762/video/1"], "folders": ["Claude"], "summary": "A summary of Anthropic's Fable 5 prompting guidance: choose effort deliberately, use /loop, give context on why, keep prompts short, define check-in points, and give the model a markdown memory with one lesson per file.", "tags": ["Claude/LLMs", "Grok Bot/prompting", "AI agents"], "actionable": true, "action_note": "Rework the Grok Bot chief-of-staff prompts using the Goal/Request/Output/Constraints template, the check-in rules, and a one-lesson-per-file memory system.", "score": 5, "metrics": {"bookmark_count": 3374, "impression_count": 164770, "like_count": 1524, "quote_count": 12, "reply_count": 62, "repost_count": 185}}, {"id": "2063958225234567417", "text": "Anthropic just officially released the blueprint for creating a company with Claude Code and it's mind-blowing\n\nCEO: 1 human (who sleeps)  \nEmployees: several AIs  \nActivities: the AIs divide up the tasks and move forward on their own\n\nWork is literally dying... I've summarized the full guide below, read it when you've got 5 min ⤵️\n\nIf you want the AI to work while you sleep → save this as a bookmark 🔖", "created_at": "2026-06-08T12:16:02.000Z", "username": "eng_khairallah1", "name": "Khairallah AL-Awady", "url": "https://x.com/eng_khairallah1/status/2063958225234567417", "urls": ["https://x.com/eng_khairallah1/status/2063958225234567417/video/1", "https://twitter.com/eng_khairallah1/status/2063907698417234316"], "folders": [], "summary": "A hype thread summarizing a claimed Anthropic guide to running a company with Claude Code, with one human CEO and several AI agents splitting up the tasks.", "tags": ["AI agents", "Claude/LLMs", "business/startups"], "actionable": false, "action_note": "May be relevant to the Grok Bot chief-of-staff setup, but the source guide needs checking first.", "score": 3, "metrics": {"bookmark_count": 722, "impression_count": 55944, "like_count": 308, "quote_count": 1, "reply_count": 45, "repost_count": 58}}, {"id": "2063721956034195785", "text": "It’s called Loop Engineering. https://t.co/hXCwiWyBSm https://t.co/zKmjvCCWBx", "created_at": "2026-06-07T20:37:11.000Z", "username": "daniel_mac8", "name": "Dan McAteer", "url": "https://x.com/daniel_mac8/status/2063721956034195785", "urls": ["https://x.com/daniel_mac8/status/2063721956034195785/photo/1", "https://twitter.com/steipete/status/2063697162748260627"], "folders": [], "summary": "A short post naming 'Loop Engineering', linking to a steipete post and an image.", "tags": ["AI agents", "dev tools"], "actionable": false, "action_note": "", "score": 3, "metrics": {"bookmark_count": 863, "impression_count": 237941, "like_count": 1746, "quote_count": 15, "reply_count": 95, "repost_count": 59}}, {"id": "2063661339306758582", "text": "Verstappen’in canlı yayında hem kendi hem Leclerc’in evinin açık adresini her detayıyla anlatması gebertti shdhdjdksgjs https://t.co/6UmYL6A6bo", "created_at": "2026-06-07T16:36:18.000Z", "username": "F1caps", "name": "F1 Caps", "url": "https://x.com/F1caps/status/2063661339306758582", "urls": ["https://x.com/ma_fe79/status/2063579975257579649/video/1"], "folders": ["Monaco Max"], "summary": "A Turkish post joking that Verstappen read out his own and Leclerc's home addresses in detail on a livestream.", "tags": ["other"], "actionable": false, "action_note": "", "score": 0, "metrics": {"bookmark_count": 2033, "impression_count": 1050314, "like_count": 11853, "quote_count": 73, "reply_count": 26, "repost_count": 538}}, {"id": "2063547299167711308", "text": "Boris Cherny, Head of Claude Code at Anthropic:\n\n\"The next transition is coming this year.\"\n\n2023: you wrote the code.\n2024: you prompted Claude to write the code.\n2025: you wrote loops that prompted Claude.\n2026: you build the harness that runs the loops.\n\nEach transition, the engineers who understood the new abstraction first moved ahead permanently.\n\nThe ones who waited caught up eventually — but never all the way.\n\nHarness engineering is the 2026 abstraction.\n\nHere is everything you need to know ↓", "created_at": "2026-06-07T09:03:09.000Z", "username": "sairahul1", "name": "Rahul", "url": "https://x.com/sairahul1/status/2063547299167711308", "urls": ["https://x.com/sairahul1/status/2063547299167711308/video/1", "https://twitter.com/sairahul1/status/2063544956158185927"], "folders": [], "summary": "Quotes Boris Cherny's framing of how coding has evolved, ending with 2026 as the year of 'harness engineering' (building the harness that runs agent loops), and teases a guide.", "tags": ["AI agents", "Claude/LLMs", "dev tools"], "actionable": false, "action_note": "", "score": 3, "metrics": {"bookmark_count": 2875, "impression_count": 370978, "like_count": 1130, "quote_count": 6, "reply_count": 60, "repost_count": 139}}, {"id": "2063529090091532540", "text": "One person rebuilt an entire company’s brain in 7 days inside Claude Code.\n\nNot a doc. Not Obsidian. A living galaxy of nodes.\n\nEvery employee. Every AI agent. Every SOP. Every tool. All wired together on one screen.\n\nClick a department. The human agent team opens up. The SOPs attached to it open up. What each person is allowed to touch opens up.\n\nThat last part is the whole game.\n\nPermissions baked into the brain. An employee opens the chat, the AI already knows what they can access. Agents, data, SOPs surface inside the conversation like you tagged them by hand.\n\nObsidian can’t do this. Notion can’t do this.\n\nNo dev team. No funding round. No 6-month roadmap. 7 days, 1 person, 1 terminal.\n\nThis is the part nobody has priced in.\n\nThe tools to build $200K enterprise software now sit on your laptop for free.\n\nThe only thing missing is the guy who opens the terminal.", "created_at": "2026-06-07T07:50:48.000Z", "username": "SpikeCalls", "name": "Spike 1%", "url": "https://x.com/SpikeCalls/status/2063529090091532540", "urls": ["https://x.com/SpikeCalls/status/2063529090091532540/video/1", "https://twitter.com/MyWestLord/status/2063321372789465409"], "folders": [], "summary": "One person built a company 'brain' in Claude Code in 7 days: a node graph of employees, agents, SOPs, and tools, with permissions built in so the chat knows what each user can access.", "tags": ["AI agents", "Claude/LLMs", "business/startups"], "actionable": true, "action_note": "A pattern for the Grok Bot chief-of-staff: a graph of projects, SOPs, and agents with access scoped per agent.", "score": 4, "metrics": {"bookmark_count": 6238, "impression_count": 787494, "like_count": 2537, "quote_count": 14, "reply_count": 139, "repost_count": 240}}, {"id": "2063380254169932234", "text": "Stephen A Smith DESTROYS Lebrons GOAT Case\n\n\"He played 23 years,he still has 2 less titles than Michael Jordan, Michael Jordan played all 82 games 8 times, how many times did Lebron do it?, Michael Jordan is a 10x Scoring Champion, how many times did Lebron do it?, Michael Jordan is 9x All Nba defensive player, how many times did Lebron do it?, theres nothing to discuss. Michael Jordan averaged over 30 in the postseason 7 times, how many times did Lebron do it?, theres nothing to discuss, hes approaching year 24 and still has 2 less titles\"\n\n(Via The Late Run Show)", "created_at": "2026-06-06T21:59:23.000Z", "username": "TheTruth8240", "name": "TheTruth", "url": "https://x.com/TheTruth8240/status/2063380254169932234", "urls": ["https://x.com/TheTruth8240/status/2063380254169932234/video/1"], "folders": [], "summary": "Stephen A. Smith argues Michael Jordan over LeBron in the GOAT debate, citing titles, scoring titles, games played, and All-Defense selections.", "tags": ["sports/betting"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 4874, "impression_count": 1926992, "like_count": 24724, "quote_count": 234, "reply_count": 634, "repost_count": 2975}}, {"id": "2062926176117469477", "text": "https://t.co/AJENMSASjD", "created_at": "2026-06-05T15:55:02.000Z", "username": "0xCodez", "name": "Codez", "url": "https://x.com/0xCodez/status/2062926176117469477", "urls": ["http://x.com/i/article/2062910491547017216"], "folders": [], "summary": "A link-only post to an X article by 0xCodez (likely the Loop Engineering article); the content wasn't captured.", "tags": ["AI agents"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 2575, "impression_count": 1224175, "like_count": 737, "quote_count": 30, "reply_count": 42, "repost_count": 89}}, {"id": "2062820959980306448", "text": "https://t.co/G9yJvOgg6a", "created_at": "2026-06-05T08:56:56.000Z", "username": "eng_khairallah1", "name": "Khairallah AL-Awady", "url": "https://x.com/eng_khairallah1/status/2062820959980306448", "urls": ["http://x.com/i/article/2062259311515140096"], "folders": [], "summary": "A link-only post to an X article by eng_khairallah1 (likely about running a company with Claude Code); the content wasn't captured.", "tags": ["AI agents"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 1122, "impression_count": 571796, "like_count": 314, "quote_count": 9, "reply_count": 31, "repost_count": 38}}, {"id": "2062809249064141017", "text": "https://t.co/bk13ZKo4AD", "created_at": "2026-06-05T08:10:24.000Z", "username": "sairahul1", "name": "Rahul", "url": "https://x.com/sairahul1/status/2062809249064141017", "urls": ["http://x.com/i/article/2062772766802325505"], "folders": ["AI"], "summary": "A link-only post to an X article by sairahul1 (likely about harness engineering); the content wasn't captured.", "tags": ["AI agents"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 3270, "impression_count": 1109296, "like_count": 739, "quote_count": 18, "reply_count": 36, "repost_count": 147}}, {"id": "2062798892006256646", "text": "Claude Code feels completely different once you install this.\n\nAnthropic quietly released an official plugin called claude-code-setup and it basically turns Claude Code from “pretty good” into an actual AI dev environment.\n\nIt scans your project and recommends:\n\n→ hooks\n→ skills\n→ MCP servers\n→ subagents\n→ automations\n\nThen sets everything up step-by-step for you.\n\nMost people are using Claude Code completely vanilla…\n\nwhich is why their experience feels messy.\n\nThe real power comes from the ecosystem around it.\n\nInstall:\n\n/plugin install claude-code-setup@claude-plugins-official\n\nBookmark this before you forget it.", "created_at": "2026-06-05T07:29:15.000Z", "username": "Suryanshti777", "name": "Suryansh Tiwari", "url": "https://x.com/Suryanshti777/status/2062798892006256646", "urls": ["https://x.com/Suryanshti777/status/2062798892006256646/video/1", "https://twitter.com/Suryanshti777/status/2062568926861742277"], "folders": [], "summary": "Promotes an official Anthropic plugin, claude-code-setup, that scans a project and recommends and sets up hooks, skills, MCP servers, subagents, and automations. Install with /plugin install claude-code-setup@claude-plugins-official.", "tags": ["dev tools", "Claude/LLMs"], "actionable": true, "action_note": "Run it on the Card Room and Athletes Only repos to set up hooks, skills, and MCP quickly. Check that the plugin actually exists before installing.", "score": 4, "metrics": {"bookmark_count": 3518, "impression_count": 357714, "like_count": 1157, "quote_count": 2, "reply_count": 38, "repost_count": 122}}, {"id": "2062124240216666225", "text": "https://t.co/bDNw7bbRph", "created_at": "2026-06-03T10:48:25.000Z", "username": "DamiDefi", "name": "Dami-Defi", "url": "https://x.com/DamiDefi/status/2062124240216666225", "urls": ["http://x.com/i/article/2061092468695662593"], "folders": [], "summary": "A link-only post to an X article by DamiDefi (possibly about crypto or DeFi); the content wasn't captured.", "tags": ["trading/markets"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 275, "impression_count": 44750, "like_count": 132, "quote_count": 1, "reply_count": 10, "repost_count": 9}}, {"id": "2061900434722496604", "text": "How do you get Claude Code to check its own work before handing it back?\n\nWatch how you can encode your manual checks so Claude closes its own feedback loop: https://t.co/gxastVL4QH", "created_at": "2026-06-02T19:59:06.000Z", "username": "ClaudeDevs", "name": "ClaudeDevs", "url": "https://x.com/ClaudeDevs/status/2061900434722496604", "urls": ["https://x.com/ClaudeDevs/status/2061900434722496604/video/1"], "folders": [], "summary": "ClaudeDevs video on writing your manual checks into Claude Code so it verifies its own work before handing it back.", "tags": ["Claude/LLMs", "dev tools", "AI agents"], "actionable": true, "action_note": "Add self-check steps (tests, lint, UI checks) to the Card Room and Athletes Only builds so Claude checks its work before returning.", "score": 5, "metrics": {"bookmark_count": 10006, "impression_count": 1008486, "like_count": 7047, "quote_count": 44, "reply_count": 155, "repost_count": 452}}, {"id": "2060710242099355902", "text": "A FORMER ANTHROPIC EMPLOYEE ALLEGEDLY LEAKED CLAUDE’S SECRET COMMANDS - AND PEOPLE ARE LOSING IT.\n \nTop 5 Claude prompts Anthropic doesn’t want you to know… so you keep wasting tokens:\n\n/ghost Use before your prompt to get a more human, natural answer.\n\nartifacts\nAdd after your prompt to make Claude build an app, game, or dashboard inside the chat.\n\nOODA Use before your prompt to force Claude into military-style decision analysis.\n\nL99 Add at the end to get the most advanced expert-level response possible.\n\n/god mode Use before your prompt to unlock Claude’s most aggressive, detailed answer style.\n\nWant more hidden Claude repos that saves you time and money? \n\nBookmark and read the article below", "created_at": "2026-05-30T13:09:42.000Z", "username": "thegreatest_sv", "name": "kiosa", "url": "https://x.com/thegreatest_sv/status/2060710242099355902", "urls": ["https://x.com/thegreatest_sv/status/2060710242099355902/video/1", "https://twitter.com/thegreatest_sv/status/2052035306094817436"], "folders": [], "summary": "Engagement-bait post claiming 'leaked secret' Claude commands like /ghost, L99 and /god mode. These are prompt folklore, not real features.", "tags": ["Claude/LLMs", "Grok Bot/prompting"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 758, "impression_count": 65667, "like_count": 432, "quote_count": 0, "reply_count": 39, "repost_count": 46}}, {"id": "2060334061785067606", "text": "Stanford just proved Claude agrees with you 49% more than a human would\n\nThe fix is the LLM Council from Andrei Karpathy. \n\nFive different advisers debate your decision inside one Claude chat:\n\n> contrarian (looks only for what will fail\n> first-principles thinker\n> expansionist (finds the upside)\n> outsider (knows nothing about your industry)\n> executor (Monday-morning next step)\n\na chairman reads it all and gives you the final call.", "created_at": "2026-05-29T12:14:54.000Z", "username": "doublenickk", "name": "Shadow Nick", "url": "https://x.com/doublenickk/status/2060334061785067606", "urls": ["https://x.com/doublenickk/status/2060334061785067606/video/1", "https://twitter.com/ScottyBeamIO/status/2059998232168571039"], "folders": [], "summary": "Says Claude is sycophantic (citing a Stanford study) and suggests an 'LLM Council' prompt: five advisor personas debate a decision and a chairman makes the final call.", "tags": ["Grok Bot/prompting", "Claude/LLMs", "AI agents"], "actionable": true, "action_note": "Use the council pattern in Grok Bot's chief-of-staff prompts to stress-test decisions like the Fanatics job pursuit or Polymarket bets.", "score": 4, "metrics": {"bookmark_count": 275, "impression_count": 55005, "like_count": 217, "quote_count": 3, "reply_count": 35, "repost_count": 28}}, {"id": "2060121171614445735", "text": "👀 Anthropic quietly released an official plugin that scans your project and auto-sets up hooks, skills, MCP servers, subagents, and automations. Most people are only using Claude Code at 20% of its potential. https://t.co/Z226APlARJ", "created_at": "2026-05-28T22:08:57.000Z", "username": "nuxley", "name": "nux.", "url": "https://x.com/nuxley/status/2060121171614445735", "urls": ["https://x.com/danrodrigux/status/2060121171614445735/video/1"], "folders": [], "summary": "Claims Anthropic released an official plugin that scans a project and auto-configures hooks, skills, MCP servers, subagents and automations for Claude Code.", "tags": ["Claude/LLMs", "dev tools", "AI agents"], "actionable": true, "action_note": "Check whether this plugin exists, then run it on the Card Room and sportsbook repos to bootstrap hooks and skills.", "score": 4, "metrics": {"bookmark_count": 2053, "impression_count": 168891, "like_count": 1084, "quote_count": 6, "reply_count": 26, "repost_count": 72}}, {"id": "2060115468531499224", "text": "introducing pi-dynamic-workflows\n\nThis is probably going to be a bigger token burner than pi-goal, BUT, dynamic workflows is the first implementation of subagents that i don't hate, mainly because it's \"code mode\" for subagents. agent writes a js-based workflow DSL into a dedicated tool, engine parses the workflow code and runs it.\n\nthe dsl implements some primitives for the agent (agent(), parallel(), pipeline(), phase() and log()) to keep it as simple as possible.\n\nnow available in @badlogicgames pi!\n\npi install npm:pi-dynamic-workflows", "created_at": "2026-05-28T21:46:17.000Z", "username": "micLivs", "name": "Michael Livs", "url": "https://x.com/micLivs/status/2060115468531499224", "urls": ["https://x.com/micLivs/status/2060115468531499224/photo/1"], "folders": ["AI"], "summary": "Introduces pi-dynamic-workflows, a plugin for the pi agent where the agent writes a JS workflow DSL (agent/parallel/pipeline/phase) to orchestrate subagents.", "tags": ["AI agents", "dev tools"], "actionable": false, "action_note": "", "score": 3, "metrics": {"bookmark_count": 1543, "impression_count": 332219, "like_count": 1091, "quote_count": 23, "reply_count": 42, "repost_count": 78}}, {"id": "2060072130339873093", "text": "Claude Code just dropped \"dynamic workflows\" and it's pretty cool.\n\nYou type \"create a workflow\" or turn on \"ultracode\" in the effort menu and it spins up hundreds of parallel agents that check each other's work.\n\nThe unit of work you can hand off jumps from a file to an entire codebase. Migrations, audits, rewrites, framework swaps, stuff you used to plan in sprints now finishes overnight.\n\nThe part that got me:....the agents argue with each other before showing you the result. Independent attempts at the same problem, then adversarial agents trying to break the answer. It keeps iterating until they converge. That's how senior engineering teams work. Except this team runs at 3am and never gets tired.\n\nAlso if the workflow gets interrupted, it picks up where it left off. That means you can kick off work that runs for days. Not sessions. Days.\n\nFair warning though: this burns through tokens FAST. \n\nAnthropic says so themselves. But if the task is a codebase migration that would have taken a team 3 months, spending $500 in tokens to do it in a week is the best trade in software.\n\nThe ceiling on what one person can build just moved again. Classic.\n\nGoing to be playing with this all week.\n\nPretty cool.", "created_at": "2026-05-28T18:54:04.000Z", "username": "gregisenberg", "name": "GREG ISENBERG", "url": "https://x.com/gregisenberg/status/2060072130339873093", "urls": ["https://twitter.com/_catwu/status/2060054180379689074"], "folders": ["AI"], "summary": "Greg Isenberg on Claude Code dynamic workflows and ultracode: many parallel agents attempt and adversarially check work, can resume after interruption, and use a lot of tokens.", "tags": ["Claude/LLMs", "AI agents", "dev tools"], "actionable": true, "action_note": "Use workflows for large jobs like the sportsbook redesign migration or a full audit of the Card Room codebase. Watch token cost.", "score": 5, "metrics": {"bookmark_count": 2680, "impression_count": 362258, "like_count": 2170, "quote_count": 27, "reply_count": 155, "repost_count": 182}}, {"id": "2060068995949076734", "text": "Everyone keeps saying AI gives them garbage. Anthropic just proved the problem is you, not the model.\n\nThis 24 minute video rebuilds one prompt from useless to flawless. Save it for the evening with tea - now that Opus 4.8 is here, getting this is everything. https://t.co/czjl3oVSvd https://t.co/DH7x6q5Kyv", "created_at": "2026-05-28T18:41:37.000Z", "username": "k1rallik", "name": "BuBBliK", "url": "https://x.com/k1rallik/status/2060068995949076734", "urls": ["https://x.com/k1rallik/status/2060068995949076734/video/1", "https://twitter.com/hanakoxbt/status/2059956659951149275"], "folders": [], "summary": "Shares a 24-minute Anthropic video that rebuilds a weak prompt step by step into a strong one.", "tags": ["Claude/LLMs", "Grok Bot/prompting"], "actionable": true, "action_note": "Apply the prompt-rebuild method to Grok Bot's chief-of-staff system prompts.", "score": 3, "metrics": {"bookmark_count": 3930, "impression_count": 249830, "like_count": 1366, "quote_count": 8, "reply_count": 29, "repost_count": 183}}, {"id": "2059956659951149275", "text": "https://t.co/nMz6z4CRtO", "created_at": "2026-05-28T11:15:14.000Z", "username": "hanakoxbt", "name": "Hanako", "url": "https://x.com/hanakoxbt/status/2059956659951149275", "urls": ["http://x.com/i/article/2059724389860442118"], "folders": [], "summary": "Link-only post to an X article, apparently the Anthropic prompt-rebuilding content referenced by another bookmark. The text has no content of its own.", "tags": ["other"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 566, "impression_count": 320448, "like_count": 156, "quote_count": 3, "reply_count": 13, "repost_count": 16}}, {"id": "2059955175473967438", "text": "Stop telling Claude, \"do this.\" \nStop telling Claude, \"write code.\" \nStop telling Claude, \"fix this error.\"  \n\nYou're actually treating a senior AI like a junior intern. \nHere are 8 prompts you can copy and paste directly:", "created_at": "2026-05-28T11:09:20.000Z", "username": "ajitcodes", "name": "Ajit kumar", "url": "https://x.com/ajitcodes/status/2059955175473967438", "urls": [], "folders": [], "summary": "Teaser thread promising 8 copy-paste prompts that treat Claude as a senior engineer rather than an intern. The post text doesn't include the prompts.", "tags": ["Claude/LLMs", "Grok Bot/prompting"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 12532, "impression_count": 1671750, "like_count": 4319, "quote_count": 26, "reply_count": 85, "repost_count": 433}}, {"id": "2059917049938530472", "text": "Complete Claude Code Training  6 HOURS.\n \nThe most comprehensive Claude training on the internet.\n\nFrom A to Z:  setup, workflow creation, website deployment, agent team creation, browser automation, client prospecting and pricing your services.\n\nAll of it without writing a single line of code.\n\nIn the end: you use Claude Code like a pro and you monetize your skills. \n\nBeginner or advanced, everything is there in one place, this course covers it all.\n\nIt's worth more than all those $500 courses you almost bought.\n\nKeep it bookmarked and watch later.", "created_at": "2026-05-28T08:37:50.000Z", "username": "sairahul1", "name": "Rahul", "url": "https://x.com/sairahul1/status/2059917049938530472", "urls": ["https://x.com/sairahul1/status/2059917049938530472/video/1", "https://twitter.com/sairahul1/status/2059915187008786817"], "folders": [], "summary": "Promotes a 6-hour no-code Claude Code course covering setup, workflows, deployment, agent teams, browser automation and monetization.", "tags": ["Claude/LLMs", "dev tools"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 3271, "impression_count": 244365, "like_count": 1555, "quote_count": 7, "reply_count": 53, "repost_count": 334}}, {"id": "2058676383912431842", "text": "Anthropic shipped 125 settings for Claude\n\nThe official docs cover 40\n\nOne developer found the other 85 and his API bill dropped from $340 to $87\n\n- not by using a cheaper model\n- not by writing shorter prompts\n\njust by moving one line in a config file to the right place \n\n> memory scoped per project → past clients never bleed into new work\n> Extended Thinking on Light by default → 18–25% fewer Opus tokens in week one\n> cache_control moved to the right line → the fix that turned a $340 bill into $87\n> plugins and MCP servers toggled off when idle → saved 25–40K tokens per session\n> per-project model override → Haiku for docs, Sonnet for infra, Opus only where it matters\n\nmost Claude users are running a $100/month tool at 30% of its actual capability", "created_at": "2026-05-24T22:27:52.000Z", "username": "doublenickk", "name": "Shadow Nick", "url": "https://x.com/doublenickk/status/2058676383912431842", "urls": ["https://x.com/doublenickk/status/2058676383912431842/video/1", "https://twitter.com/Mnilax/status/2058269663788736907"], "folders": ["AI"], "summary": "Claims undocumented Claude settings (per-project memory, thinking levels, cache_control placement, toggling idle MCP servers, per-project model overrides) cut an API bill from $340 to $87.", "tags": ["Claude/LLMs", "dev tools"], "actionable": true, "action_note": "Review prompt caching, idle MCP servers and per-project model choice to cut the cost of running agents.", "score": 3, "metrics": {"bookmark_count": 3405, "impression_count": 380769, "like_count": 1156, "quote_count": 3, "reply_count": 58, "repost_count": 115}}, {"id": "2058446664143393218", "text": "🚨 BREAKING: Claude has a feature called Decision Intelligence Mode.\n\nYou can use it to solve any business or career problem using 7 proven frameworks that consultants charge $500/hour to apply.\n\nHere are 7 prompts to access it: 👇", "created_at": "2026-05-24T07:15:03.000Z", "username": "alex_prompter", "name": "Alex Prompter", "url": "https://x.com/alex_prompter/status/2058446664143393218", "urls": [], "folders": ["AI"], "summary": "Hype thread claiming a Claude 'Decision Intelligence Mode', which is really 7 consulting-framework prompts.", "tags": ["Grok Bot/prompting", "Claude/LLMs"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 12112, "impression_count": 530117, "like_count": 3650, "quote_count": 17, "reply_count": 41, "repost_count": 466}}, {"id": "2058193075181089247", "text": "Anthropic AI engineer just showed how to give AI agents real memory in 4 steps - and it changes everything\n\nin 28 minutes he shows exactly how agents can remember across sessions, completely free\n\nworth more than any $500 AI engineering course\n\nhere's what he covers:\n\n• why agents forget everything between sessions \n• memory stores - agents read, write across sessions \n• dreaming - agents that improve their own memory \n• 95% cache hit rate, so it stays cheap\n\nmost people are still copy-pasting context into every new chat - while the people who figured this out are building agents that get smarter every single night\n\nwatch full video then read article below", "created_at": "2026-05-23T14:27:23.000Z", "username": "0xMovez", "name": "Movez", "url": "https://x.com/0xMovez/status/2058193075181089247", "urls": ["https://x.com/0xMovez/status/2058193075181089247/video/1", "https://twitter.com/0xCodez/status/2058156429559636069"], "folders": ["AI"], "summary": "Promotes a 28-minute talk on persistent agent memory: memory stores, 'dreaming' self-improvement of memory, and high cache-hit rates to keep costs down.", "tags": ["AI agents", "Claude/LLMs"], "actionable": true, "action_note": "Model Grok Bot's cross-session memory on the memory-store and dreaming patterns so it keeps context between days.", "score": 4, "metrics": {"bookmark_count": 8442, "impression_count": 713493, "like_count": 3221, "quote_count": 14, "reply_count": 105, "repost_count": 441}}, {"id": "2058191529848504673", "text": "https://t.co/7801uCC0mn", "created_at": "2026-05-23T14:21:14.000Z", "username": "GabeandPaigeGa1", "name": "Paige Marie", "url": "https://x.com/GabeandPaigeGa1/status/2058191529848504673", "urls": ["https://x.com/1109Patricia/status/2057090621068755111/video/1"], "folders": [], "summary": "Link-only repost of a video with no text, so the content is unknown.", "tags": ["other"], "actionable": false, "action_note": "", "score": 0, "metrics": {"bookmark_count": 2013, "impression_count": 49294, "like_count": 5666, "quote_count": 42, "reply_count": 283, "repost_count": 352}}, {"id": "2058103035969351896", "text": "Anthropic pays $750,000+ a year for engineers who know how to build LLMs from scratch.\n\nStanford just released the exact lecture that teaches it - 1 hour 44 minutes, free, straight from CS229.\n\nBookmark and watch it this weekend. \n\nIt'll teach you more about how ChatGPT & Claude actually work than most people at top AI companies learn in their entire careers.", "created_at": "2026-05-23T08:29:36.000Z", "username": "sairahul1", "name": "Rahul", "url": "https://x.com/sairahul1/status/2058103035969351896", "urls": ["https://x.com/sairahul1/status/2058103035969351896/video/1", "https://twitter.com/sairahul1/status/2057740928908161461"], "folders": ["AI"], "summary": "Shares a free 1h44m Stanford CS229 lecture on how LLMs are built.", "tags": ["Claude/LLMs"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 25987, "impression_count": 2211953, "like_count": 7632, "quote_count": 42, "reply_count": 103, "repost_count": 1307}}, {"id": "2057864068203966835", "text": "Finishing up projections for lots of content next week\n\n- D'Andre Swift might feed families at cost\n- I think we should be more excited about Kyle Pitts\n- I just don't want any part of Denver that isn't Bo Nix\n- LeQuint Allen might make the entire Jags backfield suck for fantasy", "created_at": "2026-05-22T16:40:01.000Z", "username": "JagSays", "name": "Jagger May", "url": "https://x.com/JagSays/status/2057864068203966835", "urls": [], "folders": [], "summary": "Fantasy football projection takes: D'Andre Swift as a value, more excitement for Kyle Pitts, avoid Denver except Bo Nix, and LeQuint Allen could hurt the Jaguars backfield.", "tags": ["fantasy football"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 1834, "impression_count": 3114037, "like_count": 3394, "quote_count": 4, "reply_count": 61, "repost_count": 26}}, {"id": "2057833957014614290", "text": "A Google Cloud engineer just showed how to build a full app with Claude from scratch\n\nhe spent 26 minutes showing exactly what one person with Claude can do, completely free\n\nworth more than any $500 vibe-coding course\n\nhere's what he covers:\n> raw idea to deployed app in a single session\n> using Claude as the entire engineering team\n> the exact workflow they use at Google\n> no big team, no prior experience needed\n\nthe people who figure out what Claude can actually do are building things everyone else thinks requires a team\n\nthat's exactly why I put together a guide on Claude features most people have no idea exist\n\nthe guide is in the article below", "created_at": "2026-05-22T14:40:22.000Z", "username": "AnatoliKopadze", "name": "Anatoli Kopadze", "url": "https://x.com/AnatoliKopadze/status/2057833957014614290", "urls": ["https://x.com/AnatoliKopadze/status/2057833957014614290/video/1", "https://twitter.com/AnatoliKopadze/status/2057813254617858078"], "folders": ["AI"], "summary": "Promotes a 26-minute video of a Google Cloud engineer building and deploying a full app with Claude in one session.", "tags": ["Claude/LLMs", "dev tools"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 12308, "impression_count": 938149, "like_count": 3831, "quote_count": 19, "reply_count": 96, "repost_count": 565}}, {"id": "2057813254617858078", "text": "https://t.co/AAWIZD1pNL", "created_at": "2026-05-22T13:18:06.000Z", "username": "AnatoliKopadze", "name": "Anatoli Kopadze", "url": "https://x.com/AnatoliKopadze/status/2057813254617858078", "urls": ["http://x.com/i/article/2057432752018903040"], "folders": ["Claude"], "summary": "A link-only post to an X article by AnatoliKopadze; the content wasn't captured.", "tags": ["other"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 25492, "impression_count": 18143566, "like_count": 5790, "quote_count": 157, "reply_count": 137, "repost_count": 915}}, {"id": "2057587993095942414", "text": "HOW AI AGENTS ACTUALLY WORK.\n\n20 minutes. clearer than any course you've paid for.\n\nBookmark this. watch it tonight.\n\nfull breakdown of both Claude Agent Teams and Kimi Agent Swarm below. https://t.co/na2F9q8UO7 https://t.co/HNNlYmWBmS", "created_at": "2026-05-21T22:23:00.000Z", "username": "kirillk_web3", "name": "Kirill", "url": "https://x.com/kirillk_web3/status/2057587993095942414", "urls": ["https://x.com/kirillk_web3/status/2057587993095942414/video/1", "https://twitter.com/kirillk_web3/status/2057497197638242362"], "folders": ["AI"], "summary": "Promo for a 20-minute video explaining how AI agents work, comparing Claude Agent Teams and Kimi Agent Swarm, with a linked breakdown article.", "tags": ["AI agents", "Claude/LLMs"], "actionable": true, "action_note": "Multi-agent team patterns could help structure Grok Bot's chief-of-staff sub-agents.", "score": 4, "metrics": {"bookmark_count": 1950, "impression_count": 279761, "like_count": 593, "quote_count": 1, "reply_count": 5, "repost_count": 67}}, {"id": "2057551699204857930", "text": "\"let it cook\" is the line Anthropic engineers just repeated all day at Code with Claude London.\n\nBoris Cherny said it in the keynote. Ravi Trivedi said it in the next talk. Katelyn Lesse said it at the panel.\n\nit means: stop micromanaging the prompts. write the routine. let Claude prompt itself.\n\nhis framing:\n> routines are higher-order prompts.\n> the runtime is shipped.\n> the prompts are the bottleneck.\n\nwhat they didn't say on stage: most routines die without 3 specific properties.\n\ni tested 30. 9 made it. the other 21 violated one of the three.\n\nthe 9 that survived are in the article.\n\nall verbatim, just copy-paste.\n\nworth more than $300 of \"prompt engineering consulting\" before you build anything.", "created_at": "2026-05-21T19:58:47.000Z", "username": "Mnilax", "name": "Mnimiy", "url": "https://x.com/Mnilax/status/2057551699204857930", "urls": ["https://x.com/Mnilax/status/2057551699204857930/video/1", "https://twitter.com/Mnilax/status/2056783455472554008"], "folders": ["AI"], "summary": "Recap of 'let it cook' from Code with Claude London: write routines (higher-order prompts) and let Claude prompt itself. The author says only 9 of 30 tested routines worked.", "tags": ["Claude/LLMs", "AI agents", "Grok Bot/prompting"], "actionable": true, "action_note": "Turn Grok Bot's repeated chief-of-staff tasks into routines rather than one-off prompts.", "score": 4, "metrics": {"bookmark_count": 5944, "impression_count": 686835, "like_count": 1286, "quote_count": 6, "reply_count": 38, "repost_count": 77}}, {"id": "2057528102368977328", "text": "instead of watching 2 hours of Netflix tonight, watch this 40-minute masterclass from the founder of a $20B China AI company\n\nit's the clearest explanation I've seen of how Agent Swarms and AI systems actually work at scale\n\nuseful whether you've never built an agent in your life or have been using Claude every day for the past year\n\nI took the key ideas and turned them into a practical guide on how to actually build with Kimi\n\nfind it below", "created_at": "2026-05-21T18:25:01.000Z", "username": "kirillk_web3", "name": "Kirill", "url": "https://x.com/kirillk_web3/status/2057528102368977328", "urls": ["https://x.com/kirillk_web3/status/2057528102368977328/video/1", "https://twitter.com/kirillk_web3/status/2057497197638242362"], "folders": ["AI"], "summary": "Promotes a 40-minute talk by a Chinese AI company founder (Kimi) on agent swarms and AI systems at scale.", "tags": ["AI agents"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 54742, "impression_count": 13974285, "like_count": 16837, "quote_count": 97, "reply_count": 108, "repost_count": 2142}}, {"id": "2057497197638242362", "text": "https://t.co/wmucj8lhh4", "created_at": "2026-05-21T16:22:13.000Z", "username": "kirillk_web3", "name": "Kirill", "url": "https://x.com/kirillk_web3/status/2057497197638242362", "urls": ["http://x.com/i/article/2056323768054603776"], "folders": ["AI"], "summary": "Link-only post to an X article. It appears to be kirillk_web3's full breakdown of Claude Agent Teams vs Kimi Agent Swarm.", "tags": ["AI agents", "Claude/LLMs"], "actionable": false, "action_note": "", "score": 3, "metrics": {"bookmark_count": 2518, "impression_count": 942456, "like_count": 566, "quote_count": 16, "reply_count": 13, "repost_count": 88}}, {"id": "2057433528363811098", "text": "Boris Cherny, the creator of Claude Code at Anthropic, just explained why most people aren't getting real results from Claude\n\nin this podcast he breaks down exactly how most people never actually set up Claude:\n\n- the 14% you lose to CLAUDE.md before typing a word\n- the features that change how Claude thinks before you type a word\n- the settings 95% of users have never opened\n- the workflows hiding behind one toggle\n\nif you've been using Claude for more than a month and never left the chat window, you have at least 30 untouched features. probably 38\n\ninstead of another show tonight, watch this\n\nmake sure to bookmark it before it gets lost in your feed\n\nmy breakdown of all 40 features is below", "created_at": "2026-05-21T12:09:13.000Z", "username": "eng_khairallah1", "name": "Khairallah AL-Awady", "url": "https://x.com/eng_khairallah1/status/2057433528363811098", "urls": ["https://x.com/eng_khairallah1/status/2057433528363811098/video/1", "https://twitter.com/eng_khairallah1/status/2057393717657374813"], "folders": [], "summary": "Thread about a podcast with Boris Cherny, creator of Claude Code, on underused Claude setup features: CLAUDE.md overhead, settings and workflows. Includes a breakdown of 40 features.", "tags": ["Claude/LLMs", "dev tools"], "actionable": true, "action_note": "Trimming CLAUDE.md and tuning settings would improve Claude Code sessions for Card Room and Athletes Only builds.", "score": 4, "metrics": {"bookmark_count": 14490, "impression_count": 1267433, "like_count": 3545, "quote_count": 14, "reply_count": 79, "repost_count": 449}}, {"id": "2057396108809081289", "text": "karpathy's CLAUDE.md hit #1 on github trending.\n220,000 stars. most devs still haven't read it.\n\nit's 65 lines.\nit took AI coding accuracy from 65% to 94%.\n\nthe 4 rules inside:\n\n→ think before coding\nstate your assumptions. ask when unsure. never guess.\n\n→ simplicity first\nwrite the minimum code that solves the problem.\nno abstractions nobody asked for.\n\n→ surgical changes\ndon't touch code unrelated to the request.\nevery changed line must trace back to what was asked.\n\n→ goal-driven execution\nturn vague instructions into verifiable success criteria\nbefore writing a single line.\n\nthat's it.\n65 lines. 4 rules. 94% accuracy.\n\nsave this before everyone else does.", "created_at": "2026-05-21T09:40:31.000Z", "username": "seelffff", "name": "self.dll", "url": "https://x.com/seelffff/status/2057396108809081289", "urls": ["https://x.com/seelffff/status/2057396108809081289/video/1", "https://twitter.com/seelffff/status/2054991798519656789"], "folders": ["AI"], "summary": "Summarizes a Karpathy-inspired CLAUDE.md with 4 rules: think before coding, simplicity first, surgical changes, and goal-driven success criteria. The accuracy claims are unverified.", "tags": ["Claude/LLMs", "dev tools"], "actionable": true, "action_note": "Add these 4 rules to the CLAUDE.md files in the Card Room, Athletes Only and sportsbook repos.", "score": 4, "metrics": {"bookmark_count": 17856, "impression_count": 2635941, "like_count": 7942, "quote_count": 48, "reply_count": 148, "repost_count": 685}}, {"id": "2056752385943556169", "text": "https://t.co/r7rUI7qqdI", "created_at": "2026-05-19T15:02:36.000Z", "username": "sairahul1", "name": "Rahul", "url": "https://x.com/sairahul1/status/2056752385943556169", "urls": ["https://resources.anthropic.com/hubfs/The-Complete-Guide-to-Building-Skill-for-Claude.pdf"], "folders": ["AI"], "summary": "Link to Anthropic's official PDF 'The Complete Guide to Building Skills for Claude'.", "tags": ["Claude/LLMs", "AI agents", "dev tools"], "actionable": true, "action_note": "Official reference for packaging repeatable chief-of-staff workflows or project tasks as Claude Skills.", "score": 5, "metrics": {"bookmark_count": 317, "impression_count": 15623, "like_count": 40, "quote_count": 0, "reply_count": 2, "repost_count": 6}}, {"id": "2055709363701264550", "text": "🚨 Anthropic just showed a 24-minute workshop on how to actually do prompts for Claude.\n\nTaught by the people who built it.\n\nFree. No registration. No paywall.\n\nI've seen $500 courses that don't cover what they teach in the first 8 minutes.\n\nWatch it and bookmark it now. https://t.co/OZ8RAOAVWZ", "created_at": "2026-05-16T17:58:00.000Z", "username": "CryptoTony__", "name": "Crypto Tony", "url": "https://x.com/CryptoTony__/status/2055709363701264550", "urls": ["https://x.com/CryptoTony__/status/2055709363701264550/video/1"], "folders": ["AI"], "summary": "Shares a free 24-minute Anthropic workshop on prompting Claude, taught by its builders.", "tags": ["Claude/LLMs", "Grok Bot/prompting"], "actionable": true, "action_note": "Prompting best practices also apply to writing Grok Bot system prompts.", "score": 3, "metrics": {"bookmark_count": 6477, "impression_count": 297973, "like_count": 2362, "quote_count": 8, "reply_count": 21, "repost_count": 380}}, {"id": "2055572713356329201", "text": "Anthropic's Head of Product just dropped a 28-minute masterclass on agent production.\n\nPrompt caching. Tool search. Programmatic tool calling. Compaction. Advisor strategy.\n\n28 minutes. Free. Worth more than 100 YouTube videos combined.\n\nWatch it first.\n\nThen read this.\n\nThe masterclass teaches you how agents work.\n\nThis teaches you what to build with them — a 5-agent content pipeline that does the work of a $300K creative team.\n\nFull pipeline below ↓\n\nBookmark this. Start this weekend.", "created_at": "2026-05-16T08:55:00.000Z", "username": "sairahul1", "name": "Rahul", "url": "https://x.com/sairahul1/status/2055572713356329201", "urls": ["https://x.com/sairahul1/status/2055572713356329201/video/1", "https://twitter.com/sairahul1/status/2055569492357586984"], "folders": ["AI"], "summary": "Promotes an Anthropic product lead's 28-minute talk on production agents (prompt caching, tool search, programmatic tool calling, compaction, advisor strategy) and a 5-agent content pipeline.", "tags": ["AI agents", "Claude/LLMs"], "actionable": true, "action_note": "Caching and compaction techniques would cut cost and context bloat for long-running chief-of-staff agents.", "score": 4, "metrics": {"bookmark_count": 7786, "impression_count": 535164, "like_count": 2339, "quote_count": 10, "reply_count": 27, "repost_count": 323}}, {"id": "2054568935274549597", "text": "https://t.co/xHKvUDKhG2", "created_at": "2026-05-13T14:26:20.000Z", "username": "AnatoliKopadze", "name": "Anatoli Kopadze", "url": "https://x.com/AnatoliKopadze/status/2054568935274549597", "urls": ["http://x.com/i/article/2053512889529413634"], "folders": ["AI"], "summary": "Link-only post to an X article. The content is unknown.", "tags": ["other"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 30693, "impression_count": 21136228, "like_count": 8214, "quote_count": 178, "reply_count": 229, "repost_count": 1377}}, {"id": "2049540796077203596", "text": "You need to be having more sex. This is medical advice.\n\nHaving sex less than once a month increases your risk of death by 2.3 TIMES.\n\nThe sweet spot in the study was 2 to 3 times a week.\n\nDaily sex also was associated with a 3 times increase in all cause mortality. https://t.co/hsyObCjsag", "created_at": "2026-04-29T17:26:19.000Z", "username": "AlpacaAurelius", "name": "Carnivore Aurelius ©🥩 ☀️🦙", "url": "https://x.com/AlpacaAurelius/status/2049540796077203596", "urls": ["https://x.com/AlpacaAurelius/status/2049540796077203596/photo/1", "https://x.com/AlpacaAurelius/status/2049540796077203596/photo/1"], "folders": [], "summary": "Viral health claim citing a study that links sexual frequency with all-cause mortality. Sweet spot is 2-3 times a week; less than monthly or daily is linked to higher risk.", "tags": ["health"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 8429, "impression_count": 2444642, "like_count": 15758, "quote_count": 790, "reply_count": 540, "repost_count": 996}}, {"id": "2049108877208138037", "text": "2. Jonah Coleman (RB, DEN)\n\nPerfect Sean Payton back.\n\n- Elite at forcing missed tackles (0.32 MTF/att)\n- Balanced through contact (4.01 YACo/att)\n- Strong hands (2 career fumbles, 1 career drop)\n\nResembles JK Dobbins/Mark Ingram as a fit in Payton's scheme in Denver. https://t.co/QSzxDXw4iW", "created_at": "2026-04-28T12:50:01.000Z", "username": "EthanKreagerFF", "name": "Ethan Kreager", "url": "https://x.com/EthanKreagerFF/status/2049108877208138037", "urls": ["https://x.com/EthanKreagerFF/status/2049108877208138037/photo/1"], "folders": ["NFL"], "summary": "Dynasty/rookie fantasy note: RB Jonah Coleman to Denver profiles as a strong Sean Payton fit, with good missed-tackle rate, yards after contact and ball security. Compared to Dobbins/Ingram.", "tags": ["fantasy football"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 22, "impression_count": 70395, "like_count": 71, "quote_count": 0, "reply_count": 3, "repost_count": 2}}, {"id": "2046958481740116134", "text": "an MIT PhD student explained his 3-year dissertation to me in 8 minutes at a bar\n\ni didn't ask. he just started drawing on a coaster.\n\n\"every 5 minutes Polymarket opens a new BTC market. up or down. 288 per day. everyone bets direction\"\n\nhe flipped the coaster.\n\n\"direction doesn't matter\"\n\n\"YES 52c. NO 48c. combined $1.00. fair. then retail panics. YES jumps to 85c. NO drops to 8c. combined 93c. 7 cents just disappeared\"\n\n\"buy whichever side the crowd underpriced. pair cost under 99c = profit no matter what\"\n\n\"73% of all 5-minute BTC markets have this. 28,000 data points\"\n\ni bought him another beer. he kept going. eight minutes. his entire PhD. on a coaster.\n\nwent home. opened Claude Opus 4.7.\n\n\"replicate this spread capture logic on Polymarket 5-minute BTC markets\"\n\nhttps://t.co/xywgRNlvyc\n\n2,900 stars. 36GB. Opus had APEX SIGNAL live by 6AM.\n\nedge table updating every tick:\n\n> BTC+100K 5m +8c.\n> BTC+99.5K 5m +11c.\n> BTC+101K 5m +41c.\n> BTC<99K 5m +13c.\n\nwhale tracker catches 329 events per session. institutional wallets load one side. retail dumps the other. bot enters automatically.\n\ncopy feed mirrors verified wallets:\nfollow whale_mirror BTC+103K 30m.\ncopy copy_alpha NO BTC+98K $75.\nmirror smart_3x YES BTC+99.5K 5m.\n\n$261K volume. 82% win rate. sharpe 3.76.\n\n+$15,356 from $900 seed.\n\ni copied the setup here: https://t.co/PTZuvewZE6\n\ntexted him monday with a screenshot.\n\nhe called immediately.\n\n\"is that my coaster running as a live trading system\"\n\ntechnically it's Claude running your coaster.\n\n\"i spent three years on that paper. you turned it into income in one weekend\"\n\nthe paper got him a PhD. the coaster got me $15K.", "created_at": "2026-04-22T14:25:07.000Z", "username": "hanakoxbt", "name": "Hanako", "url": "https://x.com/hanakoxbt/status/2046958481740116134", "urls": ["https://x.com/hanakoxbt/status/2046958481740116134/video/1", "https://twitter.com/bl888m/status/2046643416776269930"], "folders": [], "summary": "Story-style promo claiming a Claude-built bot captures YES+NO spread mispricing (pair cost under $1) on Polymarket 5-minute BTC markets, with whale copy-trading and implausible returns. Ends in a copytrade link.", "tags": ["trading/markets", "AI agents"], "actionable": true, "action_note": "The YES+NO-under-$1 arbitrage idea is worth backtesting for Polymarket work. Ignore the P&L claims and copytrade link (likely promo/scam).", "score": 3, "metrics": {"bookmark_count": 288, "impression_count": 41027, "like_count": 153, "quote_count": 1, "reply_count": 21, "repost_count": 15}}, {"id": "2046654139615326626", "text": "It’s time to go beyond language models.\n\nIntroducing Odyssey-2 Max, our most powerful world model yet. It materially advances the SOTA in physical accuracy.\n\nThis is a big step toward models that simulate and interact with the world in real time.\n\nA new intelligence entirely! https://t.co/IT6ffhmLKL", "created_at": "2026-04-21T18:15:46.000Z", "username": "odysseyml", "name": "Odyssey", "url": "https://x.com/odysseyml/status/2046654139615326626", "urls": ["https://x.com/odysseyml/status/2046654139615326626/video/1"], "folders": [], "summary": "Odyssey announces Odyssey-2 Max, a world model claiming state-of-the-art physical accuracy for real-time simulation.", "tags": ["space/tech"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 3634, "impression_count": 2187957, "like_count": 3891, "quote_count": 226, "reply_count": 188, "repost_count": 357}}, {"id": "2046252802490450309", "text": "CHRIS CAMILLO JUST LAID OUT HOW TO MAKE $500,000 A YEAR AS AN \"AI GUY\" FOR LOCAL BUSINESSES\n\nHis blueprint:\n\n1. Walk into any HVAC, plumbing, or sprinkler business.\n2. Ask where they're leaking money.\n3. Build them an AI agent that answers after-hours calls, sends instant texts, and gets quotes out in real time.\n4. Integrate it with their CRM for free.\n5. Charge them $2K-$3K/month to be their \"AI guy.\"\n\nRepeat across 10-20 businesses.\n\n\"There are people right now doing this.\"", "created_at": "2026-04-20T15:41:00.000Z", "username": "WOLF_Financial", "name": "WOLF", "url": "https://x.com/WOLF_Financial/status/2046252802490450309", "urls": ["https://x.com/WOLF_Financial/status/2046252802490450309/video/1"], "folders": [], "summary": "Chris Camillo's pitch: be the 'AI guy' for local trades businesses, building after-hours call/text/quote agents for $2-3K a month per client.", "tags": ["business/startups", "AI agents"], "actionable": false, "action_note": "", "score": 2, "metrics": {"bookmark_count": 5194, "impression_count": 4250899, "like_count": 3658, "quote_count": 233, "reply_count": 320, "repost_count": 192}}, {"id": "2045653715986915788", "text": "someone just open-sourced a full 3D building editor that runs entirely in your browser. 💀\n\nno AutoCAD. no Revit. no $5,000 annual license. no install. just open the tab.\n\nthe AEC software industry has been selling the same tools for 30 years and charging more for them every year. the moat was never the technology. it was the switching cost and the file formats.\n\na browser-based open-source alternative doesn't just undercut the price. it removes the reason to ever open your wallet in the first place.\n\narchitects, urban planners, indie game devs, anyone building physical things who got priced out. this is for them.\n\nAutodesk has had a good run.", "created_at": "2026-04-19T00:00:26.000Z", "username": "rryssf", "name": "Robert Youssef", "url": "https://x.com/rryssf/status/2045653715986915788", "urls": ["https://x.com/rryssf_/status/2045653715986915788/video/1"], "folders": [], "summary": "An open-source, browser-based 3D building editor is pitched as a free alternative to AutoCAD/Revit.", "tags": ["dev tools", "other"], "actionable": false, "action_note": "", "score": 1, "metrics": {"bookmark_count": 1623, "impression_count": 125519, "like_count": 1375, "quote_count": 14, "reply_count": 32, "repost_count": 137}}, {"id": "2045631804695003199", "text": "Satellite Operators & Services\n\n• $ASTS ($86.76) — Space-based cellular broadband direct to unmodified smartphones. BlueBird 7 launches April 19. Targeting 45-60 satellites on orbit by year-end.\n\n• $PL ($38.55) — Largest Earth observation constellation in operation. Selected as a prime under the $151B SHIELD IDIQ. Record backlog approaching $900M.\n\n• $IRDM ($41.63) — Only truly global LEO satellite network with pole-to-pole coverage. NTN Direct entering beta in 2026 for D2D connectivity.\n\n• $BKSY ($37.68) — Gen-3 constellation delivering 35cm imagery with AI-enabled change detection for NGA. $99M government IDIQ secured.", "created_at": "2026-04-18T22:33:22.000Z", "use
